<!doctype html>
<html><head><meta charset="utf-8"><title>The Honesty Layer</title>
<style>
@font-face{font-family:Rajdhani;src:url(fonts/raj300.woff2) format('woff2');font-weight:300}
@font-face{font-family:Rajdhani;src:url(fonts/raj500.woff2) format('woff2');font-weight:500}
@font-face{font-family:Rajdhani;src:url(fonts/raj600.woff2) format('woff2');font-weight:600}

html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// THE HONESTY LAYER — Sci-fi Hologram HUD, portrait 1080×1920, POV through a glasses lens. render(t) is deterministic.
import { theme, plate, targetBox, leader, rollText, monoText, wrap, corners, glitch } from './engine/hud.js';
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 1920, FPS = 30;
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
const [LC, L] = mk();       // additive light layer (wireframes)
const [GC, G] = mk();       // glow
const [SC, S2] = mk();      // café sub-render for the pull-back
const [FC, F] = mk();       // chromatic fringe scratch
const [MC, M] = mk();       // full frame
const Q = new URLSearchParams(location.search), NOSUB = Q.get('nosub') === '1';
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - clamp(k), 3);
const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const T = theme(190, 38);
const AMB = a => `hsla(38,100%,64%,${a})`, GRN = a => `hsla(150,80%,72%,${a})`;
const UI = 'Rajdhani', MONO = 'ShareTechMono';
let TL, VD = {}, FR = 0;

// ———————————————————— Head: a deformed ellipsoid with facial features, drawn as light ————————————————————
const HA = .74, HB = 1.0, HC = .86;
function headPt(x, y, z, o) {          // deformations: jaw taper, nose, eye sockets
  const jaw = 1 - .28 * clamp((-y - .25) / .75);
  x *= jaw * (o.wide || 1);
  if (z > 0) {
    z += .2 * Math.exp(-((x / .1) ** 2 + ((y + .07) / .26) ** 2));
    z -= .07 * Math.exp(-(((Math.abs(x) - .3) / .14) ** 2 + ((y - .14) / .1) ** 2));
  }
  return [x, y, z];
}
function surfZ(x, y, o) {
  const jaw = 1 - .28 * clamp((-y - .25) / .75), xx = x / (jaw * (o.wide || 1));
  const v = 1 - (xx / HA) ** 2 - (y / HB) ** 2;
  let z = HC * Math.sqrt(Math.max(0, v));
  z += .2 * Math.exp(-((x / .1) ** 2 + ((y + .07) / .26) ** 2));
  z -= .07 * Math.exp(-(((Math.abs(x) - .3) / .14) ** 2 + ((y - .14) / .1) ** 2));
  return z;
}
function proj(p, h) {                  // rotate (yaw, pitch), mirror, perspective
  let [x, y, z] = p; if (h.mirror) x = -x;
  const cy = Math.cos(h.yaw), sy = Math.sin(h.yaw);
  let x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
  const cp = Math.cos(h.pitch), sp = Math.sin(h.pitch);
  let y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
  const f = 7 / (7 - z2);
  return [h.cx + x1 * h.s * f, h.cy - y1 * h.s * f, z2];
}
function face(h, x, y, dz = 0) { return proj([x, y, surfZ(x, y, h) + .015 + dz], h); }
function strokePts(g, pts, col, w = 1.3, front = true) {
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const zz = (a[2] + b[2]) / 2, al = clamp(.22 + .78 * (zz + .4) / 1.25);
    if (h_scanY !== null && (a[1] > h_scanY && b[1] > h_scanY)) continue;
    g.strokeStyle = col(al * h_alpha); g.lineWidth = w;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
}
let h_scanY = null, h_alpha = 1;
function features(h) {
  const m = h.micro || {};
  const brow = m.brow || 0, press = m.press || 0, pup = 1 + (m.pupil || 0);
  const F = {};
  for (const s of [-1, 1]) {
    const k = s < 0 ? 'L' : 'R';
    F['brow' + k] = Array.from({ length: 14 }, (_, i) => { const u = i / 13; const x = s * lerp(.12, .52, u); return face(h, x, .3 + .07 * Math.sin(Math.PI * (.2 + .8 * u)) - .04 * u + brow * .07 * (1 - .3 * u), .03); });
    const ex = s * .3, ey = .14, ew = .13, eh = .055;
    F['lidU' + k] = Array.from({ length: 16 }, (_, i) => { const u = i / 15; return face(h, ex + (u * 2 - 1) * ew, ey + eh * Math.sin(Math.PI * u) * (1 + brow * .3)); });
    F['lidD' + k] = Array.from({ length: 16 }, (_, i) => { const u = i / 15; return face(h, ex + (u * 2 - 1) * ew, ey - eh * .7 * Math.sin(Math.PI * u)); });
    F['pup' + k] = Array.from({ length: 21 }, (_, i) => { const a = i / 20 * TAU; return face(h, ex + .042 * pup * Math.cos(a), ey + .042 * pup * Math.sin(a), .01); });
    F['iris' + k] = Array.from({ length: 21 }, (_, i) => { const a = i / 20 * TAU; return face(h, ex + .016 * pup * Math.cos(a), ey + .016 * pup * Math.sin(a), .012); });
    F['nos' + k] = Array.from({ length: 10 }, (_, i) => { const u = i / 9; return face(h, s * lerp(.03, .12, u), -.27 + .045 * Math.sin(Math.PI * u) - .02 * u, .01); });
  }
  F.bridge = Array.from({ length: 10 }, (_, i) => { const u = i / 9; return face(h, 0, lerp(.1, -.24, u)); });
  const lw = .22 * (1 - press * .12), lh = .07 * (1 - press * .75);
  F.lipU = Array.from({ length: 19 }, (_, i) => { const u = i / 18, x = (u * 2 - 1) * lw; return face(h, x, -.5 + lh * (Math.sin(Math.PI * u) * .7 + .3 * Math.abs(Math.sin(TAU * u))) * .8); });
  F.lipM = Array.from({ length: 19 }, (_, i) => { const u = i / 18, x = (u * 2 - 1) * lw; return face(h, x, -.505 + .006 * Math.sin(Math.PI * u)); });
  F.lipD = Array.from({ length: 19 }, (_, i) => { const u = i / 18, x = (u * 2 - 1) * lw; return face(h, x, -.51 - lh * Math.sin(Math.PI * u)); });
  return F;
}
const bbox = pts => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); } return [x0, y0, x1, y1]; };
function drawHead(g, h) {
  // mesh: latitude rings + meridians
  for (let i = 1; i < 14; i++) {
    const phi = i / 14 * Math.PI, pts = [];
    for (let j = 0; j <= 48; j++) { const th = j / 48 * TAU; const y = HB * Math.cos(phi), r = Math.sin(phi); pts.push(proj(headPt(HA * r * Math.sin(th), y, HC * r * Math.cos(th), h), h)); }
    strokePts(g, pts, T.line, 1.1);
  }
  for (let j = 0; j < 22; j++) {
    const th = j / 22 * TAU, pts = [];
    for (let i = 0; i <= 30; i++) { const phi = i / 30 * Math.PI; const y = HB * Math.cos(phi), r = Math.sin(phi); pts.push(proj(headPt(HA * r * Math.sin(th), y, HC * r * Math.cos(th), h), h)); }
    strokePts(g, pts, T.line, 1.1);
  }
  // neck
  for (const s of [-1, 1]) { const pts = []; for (let i = 0; i <= 10; i++) { const u = i / 10; pts.push(proj([s * lerp(.34, .42, u), lerp(-.75, -1.45, u), lerp(.1, .05, u)], h)); } strokePts(g, pts, T.line, 1.2); }
  const F = features(h);
  for (const k in F) strokePts(g, F[k], k.startsWith('pup') || k.startsWith('iris') ? T.hi : T.line, 1.8);
  if (h.glasses) {          // the wearer's own glasses, seen in the reflection
    for (const s of [-1, 1]) {
      const pts = []; for (let i = 0; i <= 40; i++) { const a = i / 40 * TAU; const x = s * .3 + .19 * Math.cos(a), y = .13 + .12 * Math.sin(a) * (Math.abs(Math.cos(a)) > .7 ? .92 : 1); pts.push(face(h, x, y, .1)); }
      strokePts(g, pts, T.hi, 2.2);
      const arm = []; for (let i = 0; i <= 8; i++) { const u = i / 8; arm.push(proj(headPt(s * lerp(.5, .72, u), .16, lerp(.55, .05, u), h), h)); } strokePts(g, arm, T.hi, 2);
    }
    strokePts(g, Array.from({ length: 8 }, (_, i) => face(h, lerp(-.11, .11, i / 7), .17 + .02 * Math.sin(Math.PI * i / 7), .11)), T.hi, 2.2);
  }
  // shoulders
  const sh = []; for (let i = 0; i <= 30; i++) { const u = i / 30 * 2 - 1; sh.push(proj([u * 1.55, -1.5 - .28 * Math.abs(u) ** 1.6 + (Math.abs(u) < .3 ? .08 * (1 - Math.abs(u) / .3) : 0), .1 - .3 * u * u], h)); }
  strokePts(g, sh, T.line, 1.3);
  return F;
}
function scanBand(g, h, y, a = 1) {      // hot scan front across the face
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createLinearGradient(0, y - 40, 0, y + 4); gr.addColorStop(0, T.hi(0)); gr.addColorStop(1, T.hi(.35 * a));
  g.fillStyle = gr; g.fillRect(h.cx - h.s * 1.3, y - 40, h.s * 2.6, 44);
  g.strokeStyle = T.hi(.9 * a); g.lineWidth = 2; g.beginPath(); g.moveTo(h.cx - h.s * 1.4, y); g.lineTo(h.cx + h.s * 1.4, y); g.stroke();
  g.restore();
}
function pad(g, h, a = 1, t = 0) {        // the projector pad survives as a reticle under the head
  g.save(); g.globalCompositeOperation = 'lighter'; g.translate(h.cx, h.cy + h.s * 1.62);
  for (const [r, al, dash] of [[.7, .35], [1.05, .7], [1.12, .4, 1], [1.45, .2]]) {
    g.setLineDash(dash ? [6, 8] : []); g.strokeStyle = T.line(al * a); g.lineWidth = 1.2;
    g.beginPath(); g.ellipse(0, 0, h.s * r, h.s * r * .16, 0, 0, TAU); g.stroke();
  }
  g.setLineDash([]); g.strokeStyle = T.dim(.4 * a);
  for (let i = 0; i < 60; i++) { const an = i / 60 * TAU + t * .12; const r0 = h.s * 1.05, r1 = h.s * (i % 10 ? 1.1 : 1.18); g.beginPath(); g.moveTo(Math.cos(an) * r0, Math.sin(an) * r0 * .16); g.lineTo(Math.cos(an) * r1, Math.sin(an) * r1 * .16); g.stroke(); }
  g.restore();
}

// ———————————————————— HUD helpers ————————————————————
function card(x, y, w, label, value, k, col, o = {}) {   // label + rolling value on a plate
  if (k <= 0) return;
  const a = clamp(k * 4), hgt = o.h || 104;
  plate(X, T, x, y, w, hgt, a);
  X.save(); X.globalCompositeOperation = 'lighter';
  X.font = `600 22px ${UI}`; X.letterSpacing = '3px'; X.fillStyle = T.line(.85 * a); X.textBaseline = 'alphabetic'; X.fillText(label, x + 18, y + 32);
  X.letterSpacing = '0px';
  const rk = seg(k, .25, 1), s = rollText(value, rk, FR, x);
  const locked = rk >= 1, flash = locked && o.lockT !== undefined && o.t - o.lockT < 2 / FPS;
  X.font = `300 ${o.vs || 52}px ${UI}`; X.fillStyle = flash ? T.hi(1) : locked ? col(1) : T.line(.9);
  monoText(X, s, x + 16, y + hgt - 18, (o.vs || 52) * .52);
  X.restore();
}
function hline(x0, y0, x1, y1, a = 1, col = T.line) { X.save(); X.globalCompositeOperation = 'lighter'; X.strokeStyle = col(a); X.lineWidth = 1.4; X.beginPath(); X.moveTo(x0, y0); X.lineTo(x1, y1); X.stroke(); X.restore(); }
function chrome(t, status, a = 1) {
  X.save(); X.globalCompositeOperation = 'lighter';
  X.strokeStyle = T.line(.5 * a); X.lineWidth = 1.5; corners(X, 70, 230, W - 150, 1490, 46);
  // rulers
  X.strokeStyle = T.dim(.4 * a); X.lineWidth = 1; X.beginPath();
  const off = (t * 9) % 24;
  for (let y = 300 + off; y < 1430; y += 24) { const big = Math.round((y - off) / 24) % 5 === 0; X.moveTo(78, y); X.lineTo(78 + (big ? 14 : 7), y); X.moveTo(W - 158, y); X.lineTo(W - 158 - (big ? 14 : 7), y); }
  X.stroke();
  X.font = `20px ${MONO}`; X.textBaseline = 'middle'; X.fillStyle = T.line(.8 * a);
  X.textAlign = 'left'; X.fillText('HONESTY LAYER // v1.0', 92, 262);
  X.textAlign = 'right'; X.fillText(status, W - 172, 262);
  X.textAlign = 'left'; X.fillStyle = T.dim(.6 * a);
  X.fillText(`T+${t.toFixed(2).padStart(5, '0')}  ·  FOV 54°  ·  ${(2035).toString()}.03.14`, 92, 1462);
  X.restore();
}
function lens(t, flick = 1) {             // lens bezel, edge vignette, bowed hairline
  X.save();
  const g = X.createRadialGradient(W / 2, H * .46, H * .28, W / 2, H * .46, H * .72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.78)'); X.fillStyle = g; X.fillRect(0, 0, W, H);
  X.beginPath(); X.rect(0, 0, W, H); rrPath(X, 22, 60, W - 44, H - 120, 190); X.fillStyle = '#000'; X.fill('evenodd');
  X.globalCompositeOperation = 'lighter';
  X.strokeStyle = T.line(.22 * flick); X.lineWidth = 1.2;
  X.beginPath(); X.moveTo(60, 160); X.quadraticCurveTo(W / 2, 128, W - 60, 160); X.stroke();
  X.beginPath(); X.moveTo(60, H - 170); X.quadraticCurveTo(W / 2, H - 136, W - 60, H - 170); X.stroke();
  X.strokeStyle = T.dim(.18 * flick); rrPath(X, 30, 68, W - 60, H - 136, 182); X.stroke();
  X.restore();
}
function rrPath(g, x, y, w, h, r) { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function grid(a = 1, px = 0, py = 0, cx = 540, cy = 820) {
  X.fillStyle = T.dim(.16 * a); const step = 48;
  const ox = ((px % step) + step) % step, oy = ((py % step) + step) % step;
  for (let y = -step + oy; y < H + step; y += step) for (let x = -step + ox; x < W + step; x += step) {
    const d = Math.hypot(x - cx, y - cy) / (W * .85); if (d > 1) continue; const s = (1 - d) * 1.6 + .4; X.fillRect(x - s / 2, y - s / 2, s, s);
  }
}
function stage(cy = 820) {
  X.fillStyle = T.bg0; X.fillRect(0, 0, W, H);
  const g = X.createRadialGradient(540, cy, 0, 540, cy, 760); g.addColorStop(0, T.bg1); g.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function glowComposite(a = 1) {          // light layer + two blur passes, additive
  X.save(); X.globalCompositeOperation = 'lighter'; X.globalAlpha = a;
  G.clearRect(0, 0, W, H); G.filter = 'blur(7px)'; G.drawImage(LC, 0, 0); G.filter = 'none';
  X.drawImage(GC, 0, 0); X.globalAlpha = a * .6; X.drawImage(GC, 0, 0);
  X.globalAlpha = a; X.drawImage(LC, 0, 0); X.restore();
}
function subtitle(t) {
  if (NOSUB) return;

  for (let i = 0; i < lines.length; i++) {
    const v = lines[i]; const t1 = v.t1;
    if (t < v.t - .1 || t >= t1) continue;
    const a = clamp((t - v.t + .1) / .12) * clamp((t1 - t) / .12);
    X.save(); X.font = `500 40px ${UI}`; const ls = wrap(X, v.text, 700);
    const w = Math.min(810, Math.max(...ls.map(s => X.measureText(s).width)) + 110), h = 34 + ls.length * 50;
    const x = 515 - w / 2, y = 1350 - h / 2;
    plate(X, T, x, y, w, h, a, { op: .66 });
    X.globalCompositeOperation = 'lighter';
    // voiceprint bars
    const speaking = v.speaker !== 'man' && t < v.t + (VD[v.id] || 2);
    for (let b = 0; b < 4; b++) { const hh = speaking ? 6 + 18 * hash(Math.floor(t * 15) + b * 3.3) : 4; X.fillStyle = T.line(.8 * a); X.fillRect(x + 22 + b * 9, 1350 - hh / 2, 4, hh); }
    if (v.speaker === 'man') { X.font = `18px ${MONO}`; X.fillStyle = T.dim(.85 * a); X.textAlign = 'center'; X.fillText('SUBJECT · TRANSCRIBED', 515, y - 12); }
    X.font = `500 40px ${UI}`; X.fillStyle = T.hi(.96 * a); X.textAlign = 'center'; X.textBaseline = 'middle';

function arrowLR(x, y, w, a, col) { X.save(); X.globalCompositeOperation = 'lighter'; X.strokeStyle = col(a); X.lineWidth = 2; X.beginPath(); X.moveTo(x, y); X.lineTo(x + w, y); X.moveTo(x + 9, y - 7); X.lineTo(x, y); X.lineTo(x + 9, y + 7); X.moveTo(x + w - 9, y - 7); X.lineTo(x + w, y); X.lineTo(x + w - 9, y + 7); X.stroke(); X.restore(); }

// ———————————————————— Scenes ————————————————————
const MAN = { wide: 1.05 };
const ME = { wide: .97, mirror: true, glasses: true };
function manHead(t) {
  const push = eio(seg(t, 4.0, 13.0)), dolly = eio(seg(t, 13.0, 14.2));
  return Object.assign({}, MAN, {
    cx: 540, cy: lerp(lerp(800, 770, push), 690, dolly), s: lerp(lerp(270, 300, push), 262, dolly),
    yaw: -.32 + .1 * Math.sin(t * .35) + .06 * push, pitch: .06 + .02 * Math.sin(t * .5),
    micro: { press: Math.max(bump(t, 8.55, 8.73), bump(t, 16.6, 16.75) * .6), brow: bump(t, 9.75, 9.96), pupil: .14 * eo(seg(t, 10.9, 11.6)) }
  });
}
function bump(t, a, b) { if (t < a - .06 || t > b + .1) return 0; return Math.min(eo(seg(t, a - .06, a + .04)), 1 - eo(seg(t, b, b + .1))); }
const LOCKS_CAFE = [['browL', 'browR', 'BROWS', 6.6], ['lidUL', 'lidUR', 'EYELIDS', 7.0], ['pupL', 'pupR', 'PUPILS', 7.4], ['nosL', 'nosR', 'NOSTRILS', 7.8], ['lipU', 'lipD', 'LIP CORNERS', 8.2]];
function cafeEnv(g, t, a) {
  g.save(); g.globalCompositeOperation = 'lighter';
  // window mullions behind
  g.strokeStyle = T.dim(.16 * a); g.lineWidth = 1;
  for (const x of [150, 330, 750, 930]) { g.beginPath(); g.moveTo(x, 300); g.lineTo(x, 1120); g.stroke(); }
  g.beginPath(); g.moveTo(110, 420); g.lineTo(970, 420); g.stroke();
  // street lights through the glass, soft
  for (let i = 0; i < 18; i++) { const x = 120 + hash(i) * 840, y = 340 + hash(i + 9) * 300; g.fillStyle = T.line(.05 * a); g.beginPath(); g.arc(x, y, 10 + 20 * hash(i + 4), 0, TAU); g.fill(); }
  // table top in perspective
  g.strokeStyle = T.line(.45 * a); g.lineWidth = 1.3;
  g.beginPath(); g.moveTo(60, 1500); g.lineTo(230, 1160); g.lineTo(850, 1160); g.lineTo(1020, 1500); g.stroke();
  g.strokeStyle = T.dim(.22 * a);
  for (let i = 1; i < 6; i++) { const u = i / 6, y = lerp(1160, 1500, u * u); g.beginPath(); g.moveTo(lerp(230, 60, u * u), y); g.lineTo(lerp(850, 1020, u * u), y); g.stroke(); }
  // cup
  const cx = 300, cy = 1300; g.strokeStyle = T.line(.55 * a);
  for (let i = 0; i <= 5; i++) { const y = cy - i * 18, r = 48 - i * 1.5; g.beginPath(); g.ellipse(cx, y, r, r * .3, 0, 0, TAU); g.stroke(); }
  g.beginPath(); g.ellipse(cx + 54, cy - 46, 16, 22, 0, -1.4, 1.4); g.stroke();
  g.beginPath(); g.ellipse(cx, cy + 6, 74, 20, 0, 0, TAU); g.stroke();
  // steam
  for (let k = 0; k < 2; k++) { g.strokeStyle = T.line(.18 * a); g.beginPath(); for (let i = 0; i <= 20; i++) { const u = i / 20; const x = cx - 10 + k * 20 + 10 * Math.sin(u * 6 + t * 1.6 + k), y = cy - 100 - u * 110; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  g.restore();
}
function drawCafe(t, into = X) {          // café: the man's face, locks, callouts, readout (drawn onto X)
  const h = manHead(t);
  stage(h.cy);
  grid(.9, -t * 6, -t * 3, 540, h.cy);
  L.clearRect(0, 0, W, H); L.globalCompositeOperation = 'lighter'; L.lineCap = 'round';
  cafeEnv(L, t, clamp((t - 4.0) / .4));
  const scanY = lerp(h.cy - h.s * 1.15, h.cy + h.s * 1.75, eio(seg(t, 4.3, 6.4)));
  h_scanY = t < 6.4 ? scanY : null; h_alpha = 1;
