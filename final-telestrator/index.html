function track(k, s) {

// ——— Camera: main broadcast camera high on the halfway line, panning and zooming with play ———
const CAMPOS = [52.5, -40, 27];
function camFor(sc, s) {
  let tx = 0, ty = 0;
  for (let i = 0; i < 6; i++) { const b = ballAt(sc, s - i * .12); tx += b[0]; ty += b[1]; }
  tx /= 6; ty /= 6;
  tx = clamp(tx, 72, 98.5); ty = clamp(ty * .55 + 34 * .45, 22, 44);
  let f;
  if (sc === 'c') f = lerp(2700, 3150, eio(seg(s, 2.6, 4.4)));

}
function mkCam(c, t, f) {

}

let CAM = null, FLAT = 0;
const BX = 1100, BY = 120, BS = 12.35;           // top-down board: half pitch x 52.5–105 → screen
const board = (x, y) => [BX + (x - 52.5) * BS, BY + (68 - y) * BS];
function P(x, y, z = 0) {
  const d = [x - CAM.c[0], y - CAM.c[1], z - CAM.c[2]];
  const zc = d[0] * CAM.fw[0] + d[1] * CAM.fw[1] + d[2] * CAM.fw[2];
  const xc = d[0] * CAM.rt[0] + d[1] * CAM.rt[1] + d[2] * CAM.rt[2];
  const yc = d[0] * CAM.up[0] + d[1] * CAM.up[1] + d[2] * CAM.up[2];
  let sx = W / 2 + CAM.f * xc / zc, sy = H / 2 - CAM.f * yc / zc, s = CAM.f / zc;
  if (FLAT > 0) { const b = board(x, y); sx = lerp(sx, b[0], FLAT); sy = lerp(sy, b[1] - z * BS * .0, FLAT); s = lerp(s, BS, FLAT); }
  return [sx, sy, s, zc];

// ——— Drawing the stadium ———
function mixHex(a, b, k) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));

}
function quad(g, pts, n = 8) {     // subdivided ground polygon so it bends correctly during the flatten

}
const CROWD = [];
(function () {

  for (let i = 0; i < 3200; i++) { const x = 113 + hash(i * 5.3 + 9) * 34, y = -14 + hash(i * 2.9 + 4) * 96; CROWD.push([x, y, 1.6 + (x - 113) * .62, i + 9000]); }
})();
const CROWDCOL = ['#3a3f4a', '#5b5f68', '#8a8d93', '#b8312f', '#d6403a', '#9fd3f2', '#e9eef2', '#2c3340', '#6b4b3a', '#c9a27a'];

    lineSeg(g, [gx, 24.84], [gx + dir * 5.5, 24.84], 4); lineSeg(g, [gx + dir * 5.5, 24.84], [gx + dir * 5.5, 43.16], 8); lineSeg(g, [gx + dir * 5.5, 43.16], [gx, 43.16], 4);
    const sx = gx + dir * 11, a = Math.acos(5.5 / 9.15);

function drawStadium(g, s) {

  if (k > 0) { g.save(); g.beginPath(); g.rect(lerp(0, BX - 40, k), 0, W, H); g.clip(); }

  if (k < 1) {
    g.save(); g.globalAlpha = 1 - k;
    g.fillStyle = '#171b23'; quad(g, [[-12, 72, 0], [118, 72, 0], [118, 118, 28.5], [-12, 118, 28.5]]); g.fill();
    quad(g, [[110, -16, 0], [110, 84, 0], [148, 84, 23.5], [148, -16, 23.5]]); g.fill();
    for (const q of CROWD) {
      const p = P(q[0], q[1], q[2]); if (p[0] < -10 || p[0] > W + 10 || p[1] < -10 || p[1] > H + 10) continue;

    quad(g, [[109.5, -12, 0], [109.5, 80, 0], [109.5, 80, .9], [109.5, -12, .9]], 12); g.fill();

function drawGoal(g, a = 1) {

function drawPlayer(g, sc, pl, s, a = 1) {

  const h = F[1] - Hd[1]; if (h < 2) return;

  }

}

    { d: .1, x: 120, y: 430, font: 'italic 800 230px Cond', text: "106'", col: COL.ink, w: 520 },
    { d: .5, x: 128, y: 540, font: '800 66px Bar', text: 'FERRAN TORRES', w: 700 },
    { d: .9, x: 128, y: 620, font: '600 38px Bar', text: 'Spain · champions of the world', col: COL.chalk, w: 700 }
  ]
};
function redCircle(cx, cy, k) {
  if (k <= 0) return; const pts = []; for (let i = 0; i <= 50; i++) { const a = -2.2 + Math.PI * 2.15 * i / 50; pts.push([cx + 78 * Math.cos(a) * (1 + .05 * Math.sin(i)), cy + 70 * Math.sin(a)]); }
  marker(pts, k, COL.space, 7, { seed: 31 });
}

// ——— Frame ———
let TL, S = {}, VD = {};
function segAt(t) { for (const s of TL.seg) if (t >= s.t0 && t < s.t1) return s; return TL.seg[TL.seg.length - 1]; }
function simOf(sg, t) {
  const u = (t - sg.t0) / (sg.t1 - sg.t0);
  if (sg.type === 'rewind') return lerp(sg.s0, sg.s1, eio(u));
  return lerp(sg.s0, sg.s1, u);
}
function homeScore(sg, s) { if (sg.type === 'board') return 1; return sg.scene === 'g' && s >= TL.goalSim ? 1 : 0; }
function flipKAt(sg, t) {   // 0..1 during the roll, then 1..2 for the yellow afterglow
  if (sg.scene !== 'g' || sg.type === 'rewind' || sg.type === 'freeze' || sg.type === 'board') return sg.type === 'board' ? 9 : 0;
  if (!(sg.s0 < TL.goalSim && sg.s1 >= TL.goalSim)) return 0;
  const tg = sg.t0 + (TL.goalSim - sg.s0) / (sg.s1 - sg.s0) * (sg.t1 - sg.t0);
  return t < tg ? 0 : (t - tg) / .5;
}
async function render(t) {
  const sg = segAt(t), lt = t - sg.t0;
  const s = simOf(sg, t);
  FLAT = 0;
  if (sg.type === 'board') {
    CAM = camFor('g', 4.45);
    FLAT = eio(seg(t, S.flat.t0 + .1, S.flat.t0 + 1.6));
    const pa = 1 - clamp(FLAT * 1.8);
    drawScene(O, 'g', 4.45, pa);
    X.drawImage(OFF, 0, 0);
    if (FLAT >= 1 && t >= S.card.t0) { X.fillStyle = `rgba(12,20,17,${.55 * seg(t, S.card.t0, S.card.t0 + .5)})`; X.fillRect(BX - 40, 0, W - BX + 40, H); }

    if (sg.id === 'flat') rowsReveal(ROWS.flat, 35.2, t);
    if (sg.id === 'card') { rowsReveal(ROWS.card, sg.t0 + .2, t); redCircle(728, 718, seg(t, sg.t0 + 3.4, sg.t0 + 4.1)); }
    if (sg.id === 'end') {
      X.fillStyle = `rgba(12,20,17,${.88 * seg(t, sg.t0, sg.t0 + .4)})`; X.fillRect(0, 0, W, H);
      rowsReveal(ROWS.end, sg.t0 + .2, t);
    }
    if (sg.id !== 'end') { X.save(); X.font = '500 18px Mono'; X.fillStyle = 'rgba(244,241,232,0.45)'; X.fillText('RECONSTRUCTION · POSITIONS ILLUSTRATIVE · STATS: PUBLISHED MATCH STATISTICS', 120, 1040 - 0); X.restore(); }
    bug('ANALYSIS'); scoreBar(1, 0, 'FT', 9, 1);
    wipe(t); subtitle(t);
    return;
  }
  CAM = camFor(sg.scene, s);
  drawScene(O, sg.scene, s);
  X.save();
  X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  let sc = 1;
  if (sg.type === 'freeze') sc = lerp(1.035, 1.0, eo(seg(lt, 0, .35))) + .012 * seg(lt, .35, sg.t1 - sg.t0);
  if (sg.type === 'rewind') X.translate((hash(Math.floor(t * 30)) - .5) * 26, 0);
  X.translate(W / 2, H / 2); X.scale(sc, sc); X.translate(-W / 2, -H / 2);
  X.filter = sg.type === 'freeze' ? 'saturate(0.58) contrast(1.05) brightness(0.95)' : sg.type === 'live' ? 'saturate(0.92) contrast(1.04)' : 'saturate(0.8) contrast(1.04)';
  X.drawImage(OFF, 0, 0); X.filter = 'none';
  if (sg.type === 'freeze') { X.fillStyle = 'rgba(40,80,140,0.08)'; X.fillRect(0, 0, W, H); }
  if (sg.type === 'freeze' && FX[sg.id]) FX[sg.id](lt, s, t);
  if (sg.id === 'slow1' || sg.id === 'slow2') { const Tp = pos('g', 'T', s); ring(Tp[0], Tp[1], COL.ink, 1, t, { beam: true }); }
  if (sg.id === 'flight') {
    if (s < 3.5) comet('g', s);
    const burst = seg(s, 3.35, 3.7); if (burst > 0 && burst < 1) { const g = P(105.6, 33.1, .9); X.save(); X.globalAlpha = 1 - burst; X.strokeStyle = COL.ink; X.lineWidth = 6; X.shadowColor = COL.ink; X.shadowBlur = 16; X.beginPath(); X.arc(g[0], g[1], 20 + 140 * eo(burst), 0, 7); X.stroke(); X.restore(); }
  }
  X.restore();
  // vignette
  const vg = X.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${sg.type === 'freeze' ? .5 : .3})`); X.fillStyle = vg; X.fillRect(0, 0, W, H);
  if (sg.type === 'freeze' && lt < .1) { X.fillStyle = `rgba(255,255,255,${.55 * (1 - lt / .1)})`; X.fillRect(0, 0, W, H); }
  if (sg.type === 'rewind') {
    X.save(); X.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 4; i++) { const y = ((hash(i * 9.1) * H) + t * 900 * (1 + i * .3)) % H; X.fillRect(0, y, W, 3 + 4 * hash(i + Math.floor(t * 30))); }
    X.font = 'italic 800 120px Cond'; X.fillStyle = '#fff'; X.shadowColor = 'rgba(0,0,0,0.6)'; X.shadowBlur = 20; X.fillText('◀◀ REWIND', 140, 560); X.restore();
  }
  const mode = sg.type === 'live' ? 'LIVE' : 'ANALYSIS';
  bug(mode);
  const fk = flipKAt(sg, t);
  scoreBar(homeScore(sg, s), 0, sg.min, fk > 0 && fk < 2 ? fk : 0, 0);
  clockTag(sg.type === 'freeze' ? '❚❚' : sg.type === 'slow' ? '▶ ½' : sg.type === 'rewind' ? '◀◀' : '');
  wipe(t); subtitle(t);
}
window.TEXTS = t => {
  const out = []; if (!TL) return out;
  const add = (rows, t0) => { for (const r of rows) if (t >= t0 + r.d) out.push({ id: r.text, text: r.text + (r.note ? ' ' + r.note : ''), x0: r.x, y0: r.y - 60, x1: r.x + (r.w || 600), y1: r.y + 40 }); };
  if (t >= 35.2 && t < S.flat.t1) add(ROWS.flat, 35.2);
  if (t >= S.card.t0 && t < S.card.t1) add(ROWS.card, S.card.t0 + .2);
  if (t >= S.end.t0) add(ROWS.end, S.end.t0 + .2);
  return out;
};
(async () => {
  TL = await (await fetch('timeline.json')).json();
  for (const s of TL.seg) S[s.id] = s;
  try { VD = await (await fetch('audio/vo/dur.json')).json(); } catch (e) { }
  await document.fonts.load('800 40px Bar'); await document.fonts.load('600 38px Bar'); await document.fonts.load('italic 800 40px Cond');
  await document.fonts.load('600 30px Cond'); await document.fonts.load('500 24px Mono');
  window.DUR = TL.dur;
  window.render = render;

})();
